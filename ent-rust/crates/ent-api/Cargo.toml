[package]
name = "ent-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "API HTTP ENT — auth+tenant dès le 1er endpoint, lit le noyau central"

[[bin]]
name = "ent-api"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
chrono = { workspace = true }
domain-eleve = { path = "../domain-eleve" }
ent-auth = { path = "../ent-auth" }
ent-db = { path = "../ent-db" }
ent-obs = { path = "../ent-obs" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "fs", "cors", "limit", "catch-panic", "set-header", "request-id", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { workspace = true }

[dev-dependencies]
ent-oidc = { path = "../ent-oidc" }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
webauthn-authenticator-rs = { version = "0.5.5", features = ["softpasskey"] }
