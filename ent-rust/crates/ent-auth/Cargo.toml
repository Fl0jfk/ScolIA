[package]
name = "ent-auth"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Auth ENT finale — argon2 + tokens de session (Postgres via ent-db)"

[dependencies]
argon2 = "0.5"
password-hash = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
thiserror = { workspace = true }
uuid = { workspace = true }
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation"] }
url = "2"
# WebAuthn (passkeys) tire openssl pour la vérification d'attestation : on force
# la compilation *vendored* pour ne pas dépendre d'un OpenSSL système (CI/dev).
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
serde_json = { workspace = true }
