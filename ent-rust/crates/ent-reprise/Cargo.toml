[package]
name = "ent-reprise"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Outil de reprise Next.js → ScolIA (socle 28) : inspecter, anonymiser. Lit des fichiers d'export, jamais une base."

# AUCUNE dépendance réseau ni base de données : l'outil ne sait pas se connecter (garde structurelle,
# vérifiée par le test `aucune_dependance_reseau_ni_base`). Il ne lit que des fichiers locaux.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
getrandom = "0.2"
chrono = { workspace = true }

[[bin]]
name = "ent-reprise"
path = "src/main.rs"

[dev-dependencies]
serde_json = { workspace = true }
