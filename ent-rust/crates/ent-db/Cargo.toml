[package]
name = "ent-db"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Postgres local ENT — garde URL, migrations, repos socle élève + events"

[dependencies]
chrono = { workspace = true }
domain-eleve = { path = "../domain-eleve" }
ent-auth = { path = "../ent-auth" }
ent-brain = { path = "../ent-brain" }
ent-events = { path = "../ent-events" }
ent-mail = { path = "../ent-mail" }
ent-sms = { path = "../ent-sms" }
ent-push = { path = "../ent-push" }
ent-bank = { path = "../ent-bank" }
ent-object = { path = "../ent-object" }
serde_json = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "derive",
] }
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
url = "2"
uuid = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
