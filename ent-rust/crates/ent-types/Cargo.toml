[package]
name = "ent-types"
description = "Types JSON partagés entre l'API Rust et le frontend Leptos (sans dépendance serveur)"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Règle (docs/ENT_TYPES_PROPOSITION.md) : AUCUNE dépendance serveur (sqlx, ent-db,
# domain-eleve, axum). Doit compiler pour wasm32-unknown-unknown.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Sans `v4` : pas de génération aléatoire (inutile ici, et problématique en WebAssembly).
uuid = { version = "1", default-features = false, features = ["serde", "std"] }
# Sans `clock` (défaut) : pas d'horloge système, compatible WebAssembly.
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
