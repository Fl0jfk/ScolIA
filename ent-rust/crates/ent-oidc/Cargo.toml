[package]
name = "ent-oidc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "SSO OIDC — découverte, PKCE, vérification id_token RS256 (JWKS) + transport HTTP"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = { workspace = true }
openssl = { version = "0.10", features = ["vendored"] }
rand = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
url = "2"
uuid = { workspace = true }

# Client HTTP dédié au SSO (échange code → tokens, JWKS). TLS rustls : pas
# d'OpenSSL système requis pour le transport chiffré.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
