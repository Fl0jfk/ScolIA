[workspace]
resolver = "2"
members = [
    "crates/ent-types",
    "crates/ent-pdf",
    "crates/ent-events",
    "crates/domain-eleve",
    "crates/ent-brain",
    "crates/ent-auth",
    "crates/ent-oidc",
    "crates/ent-obs",
    "crates/ent-mail",
    "crates/ent-sms",
    "crates/ent-push",
    "crates/ent-bank",
    "crates/ent-object",
    "crates/ent-db",
    "crates/ent-api",
    "crates/ent-lab",
    "crates/ent-reprise",
]
default-members = [
    "crates/ent-types",
    "crates/ent-pdf",
    "crates/ent-events",
    "crates/domain-eleve",
    "crates/ent-brain",
    "crates/ent-auth",
    "crates/ent-oidc",
    "crates/ent-obs",
    "crates/ent-mail",
    "crates/ent-sms",
    "crates/ent-push",
    "crates/ent-bank",
    "crates/ent-object",
    "crates/ent-db",
    "crates/ent-api",
    "crates/ent-lab",
    "crates/ent-reprise",
]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }

# Profil de développement allégé (D-015, mesuré : ≈ −80 % d'espace disque).
# Numéros de ligne conservés dans les traces d'erreur pour notre code ;
# aucune info de débogage pour les dépendances. Release inchangé.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Hachage Argon2id optimisé en dev/test (lot « base modèle des tests », mesuré le 2026-11-16).
# Un hachage dure 0,41 s sans optimisation contre 0,023 s avec opt-level 3 (×18). Le semis du labo
# (`seed_labo_cast`, appelé par presque tous les tests de base) en fait ≈ 80 : il durait 33 à 35 s et
# faisait 99 % du temps d'un test de base. Mesuré après : semis ≈ 6,5 s, test de base ≈ 6,7 s
# (≈ 12,5 s s'il sème deux fois, contre ≈ 67 s), en modes normal et RLS strict.
# `argon2` fait presque tout le gain ; `blake2` (hachage interne d'Argon2) ajoute ≈ 10 %.
# `password-hash` (simple encodage) n'a aucun effet mesurable : non listé.
# Aucun changement de code ni de paramètres : même algorithme, mêmes sorties ; release inchangé.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
