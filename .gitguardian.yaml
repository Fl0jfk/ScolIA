# Références GitHub Actions ${{ secrets.* }} dans les workflows — pas de littéraux.
# Évite les faux positifs GitGuardian sur deploy lab / prod (login registry, API Scaleway).
secret:
  ignored_paths:
    - ".github/workflows/deploy-lab.yml"
    - ".github/workflows/deploy-scaleway.yml"
    - ".github/workflows/ci.yml"
