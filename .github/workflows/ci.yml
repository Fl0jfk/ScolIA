# Vérifications rapides sur PR et push main (sans deploy / registry).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    uses: ./.github/workflows/typecheck-reusable.yml

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests unitaires
        run: npm run test:unit

  drizzle-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Valider journal migrations Drizzle
        run: node scripts/validate-drizzle-migrations.mjs

      - name: Tests garde-fou migrations
        run: npm run test:drizzle-migrations
